<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cudaVulkanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="#0A0D14" rx="16"/>
  
  <!-- Modern Chip / Compute Matrix Icon -->
  <g transform="translate(60, 42)" filter="url(#glow)">
    <rect x="10" y="10" width="96" height="96" rx="12" fill="#111827" stroke="url(#cudaVulkanGrad)" stroke-width="4"/>
    <circle cx="58" cy="58" r="22" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="6,4"/>
    <circle cx="58" cy="58" r="10" fill="url(#cudaVulkanGrad)"/>
    <line x1="28" y1="20" x2="28" y2="4" stroke="#10B981" stroke-width="3"/>
    <line x1="58" y1="10" x2="58" y2="2" stroke="#06B6D4" stroke-width="3"/>
    <line x1="88" y1="20" x2="88" y2="4" stroke="#EF4444" stroke-width="3"/>
    <line x1="28" y1="96" x2="28" y2="112" stroke="#10B981" stroke-width="3"/>
    <line x1="58" y1="106" x2="58" y2="114" stroke="#06B6D4" stroke-width="3"/>
    <line x1="88" y1="96" x2="88" y2="112" stroke="#EF4444" stroke-width="3"/>
    <line x1="20" y1="28" x2="4" y2="28" stroke="#10B981" stroke-width="3"/>
    <line x1="10" y1="58" x2="2" y2="58" stroke="#06B6D4" stroke-width="3"/>
    <line x1="20" y1="88" x2="4" y2="88" stroke="#10B981" stroke-width="3"/>
    <line x1="96" y1="28" x2="112" y2="28" stroke="#EF4444" stroke-width="3"/>
    <line x1="106" y1="58" x2="114" y2="58" stroke="#EF4444" stroke-width="3"/>
    <line x1="96" y1="88" x2="112" y2="88" stroke="#EF4444" stroke-width="3"/>
  </g>
  
  <!-- Typography -->
  <text x="200" y="88" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="2">CVUT</text>
  <text x="202" y="122" fill="url(#textGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" letter-spacing="2">CUDA-TO-VULKAN UNIVERSAL TRANSLATOR</text>
  <text x="202" y="148" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" letter-spacing="1">DROP-IN DRIVER (nvcuda.dll) &amp; SASS-TO-SPIR-V BINARY LIFTER</text>
</svg>
