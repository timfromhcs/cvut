name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static Analysis & Linting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check Rust Formatting
        run: cargo fmt --manifest-path src/lifter/Cargo.toml -- --check

      - name: Run Clippy Linter
        run: cargo clippy --manifest-path src/lifter/Cargo.toml -- -D warnings

  security-audit:
    name: Dependency & Security Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Run cargo audit
        run: |
          cargo generate-lockfile --manifest-path src/lifter/Cargo.toml
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install --locked cargo-audit
          fi
          cargo audit --manifest-path src/lifter/Cargo.toml

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [static-analysis, security-audit]
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-2022, macos-14 ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      # macOS Dependencies
      - name: Install Vulkan & MoltenVK (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install molten-vk vulkan-headers vulkan-loader spirv-tools glslang
          echo "VULKAN_SDK=$(brew --prefix molten-vk)" >> $GITHUB_ENV

      # Linux Dependencies (with Mesa Lavapipe for software Vulkan compute)
      - name: Install Vulkan SDK & Toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev vulkan-tools spirv-tools glslang-tools clang llvm mesa-vulkan-drivers libvulkan1
          vulkaninfo --summary || true

      # Windows Dependencies
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $vulkanPath = (Get-ChildItem -Path "C:\VulkanSDK" | Sort-Object Name -Descending | Select-Object -First 1).FullName
          echo "VULKAN_SDK=$vulkanPath" >> $env:GITHUB_ENV
          echo "$vulkanPath\bin" >> $env:GITHUB_PATH

      # Unified Build Command (POSIX & Windows)
      - name: Central Build (All Platforms)
        run: python scripts/build.py

      # Full hardware/software execution matrix. Lavapipe provides a real
      # Vulkan 1.3 driver on headless Linux runners, so a failure here is a
      # real failure: it MUST fail the job (no fallback masking).
      - name: Central Test Matrix (Linux, Lavapipe Vulkan)
        if: runner.os == 'Linux'
        run: |
          # Use lavapipe CPU Vulkan driver for automated testing on Linux CI runners
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          python3 scripts/test.py

      # Headless Windows/macOS runners have no executable Vulkan compute path
      # for the E2E binaries, so they honestly verify build + unit + negative
      # layers only. GPU dispatch is covered by the Linux/Lavapipe job and by
      # local hardware runs. A failure here fails the job.
      - name: Build & Unit Verification (Windows, no hardware dispatch)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --manifest-path src/lifter/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\bin\t02_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          spirv-val build/shaders/vector_add.spv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          spirv-val build/shaders/reduction_lifted.spv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build & Unit Verification (macOS, no hardware dispatch)
        if: runner.os == 'macOS'
        run: |
          cargo test --manifest-path src/lifter/Cargo.toml
          ./build/bin/t02_test
          spirv-val build/shaders/vector_add.spv
          spirv-val build/shaders/reduction_lifted.spv

  packaging-verification:
    name: Package & Artifact Integrity
    runs-on: ubuntu-24.04
    needs: [build-and-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev vulkan-tools spirv-tools glslang-tools clang llvm

      - name: Build Distribution Package
        run: python3 scripts/build.py

      - name: Verify Distribution Layout
        run: |
          test -d dist/bin
          test -d dist/lib
          test -d dist/include
          test -d dist/shaders
          test -d dist/fixtures
          test -f dist/include/cuda_runtime.h
          test -f dist/include/cuda.h
          test -f dist/include/nvml.h
          echo "Packaging integrity verified successfully."

      - name: Verify Exact Produced Artifacts
        run: |
          test -f dist/bin/sass_lifter
          test -f dist/lib/libcudart.so
          test -f dist/lib/libcuda.so
          test -f dist/lib/libnvidia-ml.so
          test -f dist/fixtures/sm80_vector_add.cubin
          test -f dist/fixtures/sm80_reduction_pure_sass.cubin
          ls dist/shaders/*.spv
          test -f dist/shaders/vector_add.spv
          test -f dist/shaders/reduction_lifted.spv
          test -f dist/shaders/matrix_transpose.spv
          test -f dist/shaders/gemm_fp16.spv
          test -f dist/shaders/reduction.spv
          test -f dist/shaders/mandelbrot_rgba8.spv
          echo "Exact artifact verification passed."

      - name: Validate Shipped SPIR-V
        run: |
          for spv in dist/shaders/*.spv; do
            echo "Validating $spv"
            spirv-val "$spv"
          done
          echo "All shipped SPIR-V modules validated."
