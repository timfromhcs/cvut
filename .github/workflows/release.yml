name: Multi-OS Release Matrix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-matrix:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: cvut-linux-x86_64
            archive_type: tar.gz
          - os: windows-2022
            artifact_name: cvut-windows-x86_64
            archive_type: zip
          - os: macos-14
            artifact_name: cvut-macos-arm64
            archive_type: tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      # macOS Native Setup & Build
      - name: Install Vulkan & MoltenVK (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install molten-vk vulkan-headers vulkan-loader spirv-tools glslang
          echo "VULKAN_SDK=$(brew --prefix molten-vk)" >> $GITHUB_ENV

      - name: Build CVUT (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/bin build/lib dist/bin dist/lib dist/include
          cargo build --release --manifest-path src/lifter/Cargo.toml
          cp src/lifter/target/release/sass_lifter build/bin/
          
          VK_INC="-I$(brew --prefix vulkan-headers)/include"
          VK_LIB="-L$(brew --prefix vulkan-loader)/lib -lvulkan"

          clang++ -std=c++20 -shared -fPIC src/runtime/cuda_runtime.cpp $VK_INC -Isrc/runtime $VK_LIB -o build/lib/libcudart.dylib
          clang++ -std=c++20 -shared -fPIC src/runtime/nvcuda_driver.cpp src/runtime/cuda_runtime.cpp $VK_INC -Isrc/runtime $VK_LIB -o build/lib/libcuda.dylib
          clang++ -std=c++20 -shared -fPIC src/runtime/nvml_shim.cpp $VK_INC -Isrc/runtime $VK_LIB -o build/lib/libnvidia-ml.dylib

          test -f build/bin/sass_lifter
          test -f build/lib/libcudart.dylib
          test -f build/lib/libcuda.dylib
          test -f build/lib/libnvidia-ml.dylib
          cp build/lib/* dist/lib/
          cp build/bin/* dist/bin/
          cp src/runtime/*.h dist/include/
          tar -czf ${{ matrix.artifact_name }}.tar.gz -C dist .

      # Linux Native Setup & Build
      - name: Install Vulkan SDK & Toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev vulkan-tools spirv-tools clang llvm

      - name: Build CVUT (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p build/bin build/lib dist/bin dist/lib dist/include
          cargo build --release --manifest-path src/lifter/Cargo.toml
          cp src/lifter/target/release/sass_lifter build/bin/
          
          clang++ -std=c++20 -shared -fPIC src/runtime/cuda_runtime.cpp -Isrc/runtime -lvulkan -o build/lib/libcudart.so
          clang++ -std=c++20 -shared -fPIC src/runtime/nvcuda_driver.cpp src/runtime/cuda_runtime.cpp -Isrc/runtime -lvulkan -o build/lib/libcuda.so
          clang++ -std=c++20 -shared -fPIC src/runtime/nvml_shim.cpp -Isrc/runtime -lvulkan -o build/lib/libnvidia-ml.so
          clang++ -std=c++20 src/tools/nvidia_smi.cpp -Isrc/runtime -Lbuild/lib -lnvidia-ml -o build/bin/nvidia-smi
          
          test -f build/bin/sass_lifter
          test -f build/lib/libcudart.so
          test -f build/lib/libcuda.so
          test -f build/lib/libnvidia-ml.so
          test -f build/bin/nvidia-smi
          cp build/lib/* dist/lib/
          cp build/bin/* dist/bin/
          cp src/runtime/*.h dist/include/
          tar -czf ${{ matrix.artifact_name }}.tar.gz -C dist .

      # Windows Native Setup & Build
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $vulkanPath = (Get-ChildItem -Path "C:\VulkanSDK" | Sort-Object Name -Descending | Select-Object -First 1).FullName
          echo "VULKAN_SDK=$vulkanPath" >> $env:GITHUB_ENV
          echo "$vulkanPath\bin" >> $env:GITHUB_PATH

      - name: Build CVUT (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/bin, build/lib, dist/bin, dist/lib, dist/include | Out-Null
          cargo build --release --manifest-path src/lifter/Cargo.toml
          Copy-Item src/lifter/target/release/sass_lifter.exe build/bin/ -Force

          $vulkanPath = $env:VULKAN_SDK
          if (-not $vulkanPath -or -not (Test-Path $vulkanPath)) {
              $vulkanPath = (Get-ChildItem -Path "C:\VulkanSDK" | Sort-Object Name -Descending | Select-Object -First 1).FullName
          }
          Write-Host "Using Vulkan SDK at: $vulkanPath"
          $vkInc = "$vulkanPath\Include"
          $vkLibDir = "$vulkanPath\Lib"

          clang++ -std=c++20 -shared -fPIC src/runtime/cuda_runtime.cpp -I"$vkInc" -Isrc/runtime -L"$vkLibDir" -lvulkan-1 -o build/lib/cudart64_12.dll
          clang++ -std=c++20 -shared -fPIC -static src/runtime/nvcuda_driver.cpp src/runtime/cuda_runtime.cpp -I"$vkInc" -Isrc/runtime -L"$vkLibDir" -lvulkan-1 -o build/bin/nvcuda.dll
          clang++ -std=c++20 -shared src/runtime/nvml_shim.cpp -I"$vkInc" -Isrc/runtime -L"$vkLibDir" -lvulkan-1 -o build/bin/nvml.dll
          clang++ -std=c++20 src/tools/nvidia_smi.cpp -I"$vkInc" -Isrc/runtime -Lbuild/bin -lnvml -o build/bin/nvidia-smi.exe

          Copy-Item build/bin/*.dll, build/bin/*.exe dist/bin/ -Force -ErrorAction Stop
          Copy-Item build/lib/*.dll dist/lib/ -Force -ErrorAction Stop
          if (-not (Test-Path build/bin/sass_lifter.exe)) { throw "sass_lifter.exe missing" }
          if (-not (Test-Path build/lib/cudart64_12.dll)) { throw "cudart64_12.dll missing" }
          if (-not (Test-Path build/bin/nvcuda.dll)) { throw "nvcuda.dll missing" }
          if (-not (Test-Path build/bin/nvidia-smi.exe)) { throw "nvidia-smi.exe missing" }
          Copy-Item src/runtime/*.h dist/include/ -Force -ErrorAction Stop
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact_name }}.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: cvut-*.*

  release:
    name: Publish GitHub Release
    needs: build-matrix
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download All Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts

      - name: Prepare Release Assets & Checksums
        run: |
          mkdir -p assets
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} assets/ \;
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: |
            assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
